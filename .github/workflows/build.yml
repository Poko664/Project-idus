# GitHub Actions: Android rpc-server -> node.apk -> Linux AppImage/.deb.
# Tag push vX.Y.Z (git tag v0.3.4 && git push --tags) publishes a GitHub Release
# with Argus-Node.apk, Linux AppImage/.deb and SHA256SUMS.txt.
name: build
on: { workflow_dispatch: {}, push: { tags: ["v*"] } }
permissions: { contents: write }

env:
  LLAMA_REF: b12008   # ONE llama.cpp version for both sides — RPC protocol must match

jobs:
  rpc-server-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ggml-rpc-server for arm64-v8a
        run: ANDROID_NDK=$ANDROID_NDK_LATEST_HOME ./android/scripts/build-rpc-server.sh
      - uses: actions/upload-artifact@v4
        with:
          name: librpc_server
          path: android/app/src/main/jniLibs/arm64-v8a/librpc_server.so

  node-apk:
    needs: rpc-server-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: librpc_server
          path: android/app/src/main/jniLibs/arm64-v8a
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # -Pandroid.useAndroidX / enableJetifier — страховка на случай, если gradle.properties
      # не попал в коммит. Лучше всё же добавить android/gradle.properties в репозиторий.
      - run: >
          gradle -p android assembleRelease
          -Pandroid.useAndroidX=true
          -Pandroid.enableJetifier=true
          -Pandroid.suppressUnsupportedCompileSdk=35
      - name: Sign node.apk with the Argus key
        env:
          KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}"
          KS_PASS: "${{ secrets.ANDROID_KEYSTORE_PASS }}"
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > argus.jks
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/zipalign -f -p 4 $APK aligned.apk
            $BT/apksigner sign --ks argus.jks --ks-pass "pass:${KS_PASS:-argus123}" --out node.apk aligned.apk
            rm -f argus.jks
          else
            echo "::warning::ANDROID_KEYSTORE_B64 not set — node.apk is signed with a CI debug key and cannot update existing installs"
            cp $APK node.apk
          fi
          VC=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts)
          VN=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          printf '%s (%s)' "$VN" "$VC" > node.version
          cat node.version
      - uses: actions/upload-artifact@v4
        with:
          name: node-apk
          path: |
            node.apk
            node.version

  # Linux desktop: AppImage + .deb with llama-server b12008 (Vulkan, x64) and adb bundled.
  desktop-linux:
    needs: node-apk
    runs-on: ubuntu-22.04
    env:
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries (Tauri 2 / webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev \
            build-essential curl wget file unzip
      - uses: actions/download-artifact@v4
        with:
          name: node-apk
          path: desktop/src-tauri/resources
      - name: Bundle llama-server (Vulkan, RPC) + adb
        run: |
          set -e
          R=desktop/src-tauri/resources
          base=https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_REF
          curl -fsSL -o llama.tgz $base/llama-$LLAMA_REF-bin-ubuntu-vulkan-x64.tar.gz
          mkdir -p llama && tar -xzf llama.tgz -C llama --strip-components=1
          cp llama/llama-server $R/
          for f in llama/*.so*; do
            b=$(basename "$f")
            case "$b" in *-impl.so) [ "$b" = libllama-server-impl.so ] || continue ;; esac
            if [ -L "$f" ] && [ -e "$f.0" ]; then continue; fi
            case "$b" in *.so|*.so.0) cp -L "$f" "$R/$b" ;; esac
          done
          curl -fsSL -o pt.zip https://dl.google.com/android/repository/platform-tools-latest-linux.zip
          unzip -q pt.zip && cp platform-tools/adb $R/
          chmod +x $R/llama-server $R/adb
          ls -la $R
      - run: npm ci
        working-directory: desktop
      - run: npx tauri build --bundles appimage,deb
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: argus-linux
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [node-apk, desktop-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect assets + SHA256SUMS.txt
        run: |
          set -e
          V=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          [ "${GITHUB_REF_NAME}" = "v$V" ] || { \
            echo "::error::tag ${GITHUB_REF_NAME} != app version v$V (tauri.conf.json)"; exit 1; }
          mkdir -p dist
          cp artifacts/node-apk/node.apk dist/Argus-Node.apk
          find artifacts/argus-linux -name '*.AppImage' -exec cp {} dist/ \;
          find artifacts/argus-linux -name '*.deb'     -exec cp {} dist/ \;
          bash scripts/make-release-assets.sh dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Argus ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Argus-Node.apk
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS.txt
